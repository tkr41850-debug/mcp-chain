# .goreleaser.yaml — Phase 9 release config (DIST-02).
# v2 format (version: 2 required).
# Mirrors Makefile flags: -trimpath + -s -w -X main.version=...
version: 2

project_name: mcp-chain

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: mcp-chain
    main: ./cmd/mcp-chain
    binary: mcp-chain
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: mcp-chain
    ids:
      - mcp-chain
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - README*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}'

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: anthropics
    name: mcp-chain
  draft: false
  prerelease: auto
  name_template: '{{.ProjectName}} {{.Version}}'
